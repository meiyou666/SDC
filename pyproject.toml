[project]
name = "sdc"
version = "0.1.0"
description = "ABFT research and evaluation workspace"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false
required-version = "==0.12.24"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
