name: Environment policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-consistency:
    name: Environment consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Build uv tooling container
        run: docker compose build tools
      - name: Check native uv lock
        run: docker compose run --rm -T --user "$(id -u):$(id -g)" tools lock --check
      - name: Check environment consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGE_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          docker compose run --rm -T --user "$(id -u):$(id -g)" --entrypoint python tools \
            scripts/ci/check_environment.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --author "$CHANGE_AUTHOR" --owner "$REPOSITORY_OWNER"
      - name: Build the shared development container
        run: docker compose build dev
      - name: Verify installed versions and numerical tools
        run: docker compose run --rm -T --user "$(id -u):$(id -g)" dev python environment/verify_environment.py --smoke
      - name: Run tests through the project launcher
        run: ./dev.sh uv run --locked pytest -q -p no:cacheprovider
      - name: Check Python errors
        run: docker compose run --rm -T --user "$(id -u):$(id -g)" dev uv run --locked ruff check --no-cache .
