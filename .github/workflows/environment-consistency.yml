name: Environment policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-consistency:
    name: Environment consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up policy-check Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check the policy tool
        run: python -m unittest discover -s tests/ci -v
      - name: Check environment consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGE_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          python scripts/ci/check_environment.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --author "$CHANGE_AUTHOR" --owner "$REPOSITORY_OWNER"
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Build the shared development container
        run: docker compose build dev
      - name: Verify installed versions and numerical tools
        run: docker compose run --rm -T dev python environment/verify_environment.py --smoke
      - name: Run tests in the shared environment
        run: docker compose run --rm -T dev python -m pytest -q -p no:cacheprovider
      - name: Check Python errors
        run: docker compose run --rm -T dev ruff check --no-cache .
