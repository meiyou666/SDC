name: Environment policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  environment-consistency:
    name: Environment consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate container configuration
        run: docker compose --profile nvidia --profile ascend config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host
      - name: Build uv tooling container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: environment/docker/Dockerfile
          target: tooling
          network: host
          allow: network.host
          platforms: linux/amd64
          load: true
          tags: sdc-uv-tools:py311
          build-args: SDC_APT_MIRROR=http://archive.ubuntu.com/ubuntu
          cache-from: type=gha,scope=sdc-ci-tooling
          cache-to: type=gha,scope=sdc-ci-tooling,mode=max,ignore-error=true
      - name: Check environment script syntax
        run: |
          docker compose run --rm -T --entrypoint bash tools -c \
            'for script in dev.sh scripts/*.sh environment/docker/*.sh environment/docker/nested/*.sh; do bash -n "$script" || exit; done'
      - name: Check native uv lock
        run: docker compose run --rm -T --user "$(id -u):$(id -g)" tools lock --check
      - name: Check environment consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGE_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          docker compose run --rm -T --user "$(id -u):$(id -g)" --entrypoint python tools \
            scripts/ci/check_environment.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --author "$CHANGE_AUTHOR" --owner "$REPOSITORY_OWNER"
      - name: Build the shared development container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: environment/docker/Dockerfile
          target: development
          network: host
          allow: network.host
          platforms: linux/amd64
          load: true
          tags: sdc-dev:py311
          build-args: |
            SDC_APT_MIRROR=http://archive.ubuntu.com/ubuntu
            SDC_INSTALL_AI_TOOLS=false
          cache-from: |
            type=gha,scope=sdc-ci-development
            type=gha,scope=sdc-ci-tooling
          cache-to: type=gha,scope=sdc-ci-development,mode=max,ignore-error=true
      - name: Verify installed versions and numerical tools
        run: docker compose run --rm -T --user "$(id -u):$(id -g)" dev python environment/verify_environment.py --smoke
      - name: Run tests and Python checks
        run: docker compose run --rm -T --user "$(id -u):$(id -g)" dev bash scripts/check.sh
