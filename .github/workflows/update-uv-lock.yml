name: Update uv lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update native lock inside Docker
        run: |
          docker compose build tools
          docker compose run --rm -T --user "$(id -u):$(id -g)" tools lock
          docker compose run --rm -T --user "$(id -u):$(id -g)" tools lock --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
