name: Update uv lock

on:
  workflow_dispatch:
    inputs:
      index-url:
        description: "依赖源地址；留空时使用 pyproject.toml 中的设置"
        required: false
        type: string

permissions:
  contents: read

jobs:
  lock:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update native lock inside Docker
        env:
          PACKAGE_INDEX: ${{ inputs.index-url }}
        run: |
          docker compose build tools
          index_args=()
          if [ -n "$PACKAGE_INDEX" ]; then
            index_args=(--default-index "$PACKAGE_INDEX")
          fi
          docker compose run --rm -T --user "$(id -u):$(id -g)" tools lock "${index_args[@]}"
          docker compose run --rm -T --user "$(id -u):$(id -g)" tools lock --check "${index_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
