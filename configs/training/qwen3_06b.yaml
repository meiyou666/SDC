name: qwen3_06b_wikitext103

model:
  name_or_path: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  attention: eager
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false

data:
  source: huggingface
  name: Salesforce/wikitext
  subset: wikitext-103-raw-v1
  revision: b08601e04326c79dfdd32d625aee71d232d685c3
  train_split: train
  validation_split: validation
  text_field: text
  block_size: 512
  max_train_documents: 50000
  max_validation_documents: 2000
  prepared_dir: data/training/qwen3_06b_wikitext103

gemm:
  backend: cutlass
  precision: bf16
  scaling: none
  global_scale: amax
  abft: none

training:
  output_dir: results/training/qwen3_06b_wikitext103/{device}
  device: accelerator
  precision: bf16
  offline: false
  resume: null
  optimizer: adamw_torch
  lr_scheduler_type: cosine
  tf32: false
  save_strategy: steps
  eval_strategy: steps
  seed: 2026
  max_steps: 1000  # 参数更新次数；数据遍历完后继续下一轮
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.00002
  weight_decay: 0.1
  warmup_steps: 50
  logging_steps: 10
  progress_bar: true
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
