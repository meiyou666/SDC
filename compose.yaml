services:
  dev:
    image: sdc-dev:py311
    platform: linux/amd64
    build:
      context: .
      dockerfile: environment/docker/Dockerfile
      target: development
    init: true
    shm_size: 2gb
    working_dir: /workspace/SDC
    volumes:
      - .:/workspace/SDC
      - codex-state:/home/sdc/.codex
      - ai-tools:/home/sdc/.local
      - ssh-state:/home/sdc/.ssh
      - download-cache:/home/sdc/.cache
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /workspace/SDC/src
    stdin_open: true
    tty: true
    command: ["bash"]
  tools:
    image: sdc-uv-tools:py311
    profiles: ["tools"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: environment/docker/Dockerfile
      target: tooling
    working_dir: /workspace/SDC
    volumes:
      - .:/workspace/SDC
    entrypoint: ["uv"]
    command: ["lock", "--check"]

volumes:
  codex-state:
  ai-tools:
  ssh-state:
  download-cache:
