services:
  dev:
    image: sdc-dev:py311
    platform: linux/amd64
    build:
      context: .
      dockerfile: environment/docker/Dockerfile
      target: development
    init: true
    working_dir: /workspace/SDC
    volumes:
      - .:/workspace/SDC
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /workspace/SDC/src
    stdin_open: true
    tty: true
    command: ["bash"]
  tools:
    image: sdc-uv-tools:py311
    profiles: ["tools"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: environment/docker/Dockerfile
      target: tooling
    working_dir: /workspace/SDC
    volumes:
      - .:/workspace/SDC
    entrypoint: ["uv"]
    command: ["lock", "--check"]
